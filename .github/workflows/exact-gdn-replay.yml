name: Exact GDN replay source checks

on:
  pull_request:
    paths:
      - "exact-gdn-replay/**"
      - ".github/workflows/exact-gdn-replay.yml"
  push:
    paths:
      - "exact-gdn-replay/**"
      - ".github/workflows/exact-gdn-replay.yml"

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install review tools
        run: python -m pip install ruff==0.16.9 pytest==9.1.1 clang-format==23.1.1
      - name: Python lint, format and installation guards
        run: |
          ruff check exact-gdn-replay
          ruff format --check exact-gdn-replay
          python -m compileall -q exact-gdn-replay
          pytest -q exact-gdn-replay/tests/test_install.py -k 'not exact_image_sources'
      - name: C++ formatting
        run: |
          clang-format --dry-run --Werror -style=Google \
            exact-gdn-replay/csrc/ops.cpp \
            exact-gdn-replay/csrc/commit.cu \
            exact-gdn-replay/csrc/replay.h
      - name: Verify native arithmetic provenance
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/vllm-project/vllm/ced6857afa0ea7b2e3f0846a62e1394e90f15607/csrc/libtorch_stable/gdn/fused_gdn_decode_kernel.cu \
            --output /tmp/reference-gdn.cu
          python exact-gdn-replay/tests/check_verifier_source.py /tmp/reference-gdn.cu
      # GPU differential, sanitizer and serving tests require the pinned GB10
      # environment. CPU CI is not a substitute for the recorded GPU evidence.
